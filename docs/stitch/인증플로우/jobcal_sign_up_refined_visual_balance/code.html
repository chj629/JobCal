<body class="bg-surface text-on-surface min-h-screen flex flex-col font-body-md antialiased selection:bg-primary-fixed selection:text-primary">

<header class="fixed top-0 w-full z-50 bg-white/80 backdrop-blur-md border-b border-outline-variant/50 sticky">
<div class="flex justify-between items-center px-6 py-4 max-w-[1400px] mx-auto">
<div class="text-2xl font-bold text-primary tracking-tight leading-none">
JobCal
</div>
<nav class="hidden md:flex items-center gap-8 text-[13px] text-on-surface-variant">
<div class="flex items-center gap-2 font-medium">
<button class="hover:text-primary transition-colors">日本語</button>
<span class="text-outline-variant">/</span>
<button class="hover:text-primary transition-colors">한국어</button>
</div>
</nav>
<button class="md:hidden text-primary">
<span class="material-symbols-outlined">menu</span>
</button>
</div>

<main class="flex-grow flex items-center justify-center p-6 md:p-12">
<div class="max-w-6xl w-full grid grid-cols-1 md:grid-cols-2 gap-16 md:gap-24 items-center">
<!-- Left Column: Product Message -->
<div class="flex flex-col pr-0 md:pr-8 space-y-8">
<div class="space-y-6">
<h1 class="text-[32px] md:text-[48px] text-on-surface tracking-tight leading-[1.1] font-medium whitespace-pre-line">複雑な就職活動を、
                        ひとつに。</h1>
<p class="text-[16px] text-on-surface-variant whitespace-pre-line max-w-lg leading-[1.5]">企業、選考、予定をまとめて管理。
                        JobCalなら、次にやることがすぐに分かります。</p>
</div>
<ul class="space-y-4">
<li class="flex items-center space-x-4 text-on-surface-variant">
<div class="w-7 h-7 rounded-full bg-primary-fixed/50 flex items-center justify-center text-primary">
<span class="material-symbols-outlined text-[16px]" data-icon="business_center">business_center</span>
</div>
<span class="text-[15px]">企業と選考をまとめて管理</span>
</li>
<li class="flex items-center space-x-4 text-on-surface-variant">
<div class="w-7 h-7 rounded-full bg-primary-fixed/50 flex items-center justify-center text-primary">
<span class="material-symbols-outlined text-[16px]" data-icon="calendar_today">calendar_today</span>
</div>
<span class="text-[15px]">大切な予定を見逃さない</span>
</li>
<li class="flex items-center space-x-4 text-on-surface-variant">
<div class="w-7 h-7 rounded-full bg-primary-fixed/50 flex items-center justify-center text-primary">
<span class="material-symbols-outlined text-[16px]" data-icon="auto_awesome">auto_awesome</span>
</div>
<span class="text-[15px]">AIでメールから情報を整理</span>
</li>
</ul>
</div>

<div class="bg-surface flex flex-col space-y-8">
<div class="text-center space-y-2">
<h2 class="text-[32px] text-on-surface font-medium tracking-tight">アカウント作成</h2>
<p class="text-[15px] text-on-surface-variant">JobCalを無料で始めましょう。</p>
</div>

<span class="">Googleで登録</span>
</button>
<div class="relative flex items-center py-2">
<div class="flex-grow border-t border-outline-variant"></div>
<span class="flex-shrink-0 mx-4 text-on-surface-variant text-[13px]">または</span>
<div class="flex-grow border-t border-outline-variant"></div>
</div>

<div class="space-y-2">
<label class="block text-[14px] text-on-surface font-medium" for="email">メールアドレス</label>
<input class="w-full bg-surface border border-outline rounded-full px-5 py-3.5 text-on-surface placeholder:text-outline focus:outline-none focus:ring-2 focus:ring-primary-fixed focus:border-primary transition-all text-[15px]" id="email" placeholder="example@email.com" type="email"/>
</div>
<div class="space-y-2">
<div class="flex justify-between items-center">
<label class="block text-[14px] text-on-surface font-medium" for="password">パスワード</label>
</div>
<div class="relative">
<input class="w-full bg-surface border border-outline rounded-full px-5 py-3.5 text-on-surface placeholder:text-outline focus:outline-none focus:ring-2 focus:ring-primary-fixed focus:border-primary transition-all text-[15px]" id="password" placeholder="••••••••" type="password"/>
<button class="absolute right-5 top-1/2 -translate-y-1/2 text-outline hover:text-on-surface-variant transition-colors flex items-center" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="visibility_off">visibility_off</span>
</button>
</div>
</div><div class="space-y-2"><label class="block text-[14px] text-on-surface font-medium" for="password_confirmation">パスワード確認</label><div class="relative"><input class="w-full bg-surface border border-outline rounded-full px-5 py-3.5 text-on-surface placeholder:text-outline focus:outline-none focus:ring-2 focus:ring-primary-fixed focus:border-primary transition-all text-[15px]" id="password_confirmation" placeholder="••••••••" type="password"/><button class="absolute right-5 top-1/2 -translate-y-1/2 text-outline hover:text-on-surface-variant transition-colors flex items-center" type="button"><span class="material-symbols-outlined text-[20px]" data-icon="visibility_off">visibility_off</span></button></div></div>
<button class="w-full h-[52px] bg-primary text-on-primary rounded-full px-6 text-[15px] font-medium hover:bg-[#152c6e] transition-colors mt-4 shadow-sm" type="submit">アカウントを作成</button>

<div class="text-center pt-4">
<p class="text-[14px] text-on-surface-variant">すでにアカウントをお持ちの方 <a class="text-primary font-medium hover:underline transition-colors ml-1" href="#">ログイン</a></p>
